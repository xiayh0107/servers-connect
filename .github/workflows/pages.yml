name: pages

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "ssh-server-manager/docs/**"
      - "ssh-server-manager/references/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install markdown
      # Wraps the headless website/index.html into a full document and renders
      # ssh-server-manager/{docs,references}/*.md into /docs/.
      - name: Build site
        run: python website/build.py --out _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
