name: test

on:
  push:
  pull_request:

jobs:
  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e "./ssh-server-manager[test]" -c ssh-server-manager/contracts/constraints.txt
      - run: python -m pytest ssh-server-manager/tests
      - run: python ssh-server-manager/scripts/export-openapi.py --check ssh-server-manager/contracts/api-v1.openapi.json
      - run: python -m compileall -q ssh-server-manager/scripts


  ui-interactions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ssh-server-manager/tests/ui/package-lock.json
      - run: npm ci --prefix ssh-server-manager/tests/ui
      - run: node ssh-server-manager/tests/test_host_details_node.mjs
      - run: npm test --prefix ssh-server-manager/tests/ui
