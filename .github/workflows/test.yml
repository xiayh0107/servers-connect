name: test

on:
  push:
  pull_request:

jobs:
  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
          cache: npm
          cache-dependency-path: ssh-server-manager/frontend/package-lock.json
      - run: python -m pip install -e "./ssh-server-manager[test]" -c ssh-server-manager/contracts/constraints.txt
      - run: python -m pytest ssh-server-manager/tests
      - name: Verify Include inheritance with native and Git Windows SSH
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # Real ssh -G checks use temporary configs, with no connection or keys.
          # Git/MSYS and native OpenSSH interpret Windows Include paths differently.
          $ssmSshClients = @(
            "$env:WINDIR\System32\OpenSSH\ssh.exe",
            "$env:ProgramFiles\Git\usr\bin\ssh.exe"
          )
          foreach ($ssmSshClient in $ssmSshClients) {
            if (-not (Test-Path $ssmSshClient)) { throw "Missing SSH client: $ssmSshClient" }
            $env:SSM_TEST_SSH_CLIENT = $ssmSshClient
            python -m pytest -q --tb=short ssh-server-manager/tests/test_ssh_config.py ssh-server-manager/tests/test_importer.py ssh-server-manager/tests/test_process_args.py
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Remove-Item Env:SSM_TEST_SSH_CLIENT
      - name: Repeat independent Windows credential probes
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # Fail immediately; each invocation creates a fresh isolated topology.
          # Keep native client selection consistent with the full suite.
          # Alternate the untouched proof parser and first-read observation.
          for ($ssmProbeIteration = 1; $ssmProbeIteration -le 10; $ssmProbeIteration++) {
            $env:SSM_TEST_NATIVE_PROOF = [string]($ssmProbeIteration % 2)
            python -m pytest -q --tb=short ssh-server-manager/tests/test_modern_fixture.py::test_request_probe_preserves_an_unbound_managed_jumps_configured_identity ssh-server-manager/tests/test_credential_probe.py::test_real_callback_and_proxy_handle_runtime_path_metacharacters ssh-server-manager/tests/test_modern_fixture.py::test_request_credential_probe_uses_saved_trust_stores_without_touching_hosts 'ssh-server-manager/tests/test_credential_probe.py::test_real_authentication_password_none_and_banner_isolation[False-True]'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - run: python ssh-server-manager/scripts/export-openapi.py --check ssh-server-manager/contracts/api-v1.openapi.json
      - run: python -m compileall -q ssh-server-manager/scripts
      - run: npm ci --prefix ssh-server-manager/frontend
      - run: npm run check-types --prefix ssh-server-manager/frontend
      - run: npm run typecheck --prefix ssh-server-manager/frontend
      - run: npm test --prefix ssh-server-manager/frontend
      - run: npm run check-build --prefix ssh-server-manager/frontend
      - run: python -m pip install build
      - run: python -m build --outdir ssh-server-manager/dist ./ssh-server-manager
      - name: Verify wheel and sdist installations outside the checkout
        shell: bash
        run: |
          version=$(python -c 'import ssh_server_manager; print(ssh_server_manager.__version__)')
          for distribution in ssh-server-manager/dist/*; do
            python ssh-server-manager/scripts/packaging-smoke.py "$distribution" --version "$version"
          done
      - name: Upgrade populated published 0.8.0 database
        if: matrix.python == '3.13'
        shell: bash
        run: |
          version=$(python -c 'import ssh_server_manager; print(ssh_server_manager.__version__)')
          python ssh-server-manager/scripts/upgrade-smoke.py ssh-server-manager/dist/*.whl --version "$version"

  browser-topology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
          cache: npm
          cache-dependency-path: ssh-server-manager/frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e "./ssh-server-manager[test]" -c ssh-server-manager/contracts/constraints.txt
      - run: npm ci --prefix ssh-server-manager/frontend
      - name: Install Chromium
        working-directory: ssh-server-manager/frontend
        run: npx playwright install --with-deps chromium
      - name: Six-page browser checks and isolated strict SSH/SFTP topology
        working-directory: ssh-server-manager/frontend
        env:
          SSM_E2E_PYTHON: python
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-report
          path: ssh-server-manager/frontend/playwright-report/
          retention-days: 7
